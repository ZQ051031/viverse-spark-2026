name: Test and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - run: npm run smoke
      - name: Package the static site
        run: |
          mkdir site
          cp index.html style.css spark.svg game.js logic.js view.js LICENSE site/
          cp -R vendor site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Report missing Pages configuration
        if: ${{ !github.event.repository.has_pages }}
        run: echo "::warning::GitHub Pages is disabled. A repository administrator must choose GitHub Actions in Settings → Pages to publish this artifact."

  deploy:
    needs: test
    if: ${{ github.event.repository.has_pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
